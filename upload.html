<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Données - Cleaning Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .upload-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        .upload-input {
            display: none;
        }

        .upload-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .upload-button:hover {
            transform: scale(1.05);
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .status.loading {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .files-list {
            margin-top: 15px;
            font-size: 0.9em;
        }

        .file-item {
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-link a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="upload-card">
            <h1>📦 Upload de Données</h1>
            <p class="subtitle">Téléchargez un fichier ZIP contenant vos fichiers Excel</p>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Glissez-déposez votre fichier ZIP ici</div>
                <div class="upload-hint">ou cliquez pour sélectionner un fichier</div>
                <input type="file" id="fileInput" class="upload-input" accept=".zip">
                <button class="upload-button" onclick="document.getElementById('fileInput').click()">
                    📂 Choisir un fichier
                </button>
            </div>

            <div id="status" class="status"></div>
        </div>

        <div class="back-link">
            <a href="dashboard.html">← Retour au Dashboard</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        // Auth Check
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) {
            window.location.href = 'login.html';
        }

        if (user.role !== 'ADMIN') {
            alert('Accès réservé aux administrateurs.');
            window.location.href = 'dashboard.html';
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const statusEl = document.getElementById('status');

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.name.endsWith('.zip')) {
                showStatus('error', '❌ Veuillez sélectionner un fichier ZIP');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            showStatus('loading', `📤 Upload et traitement de ${file.name}...`);

            try {
                const response = await fetch(`${API_URL}/upload/zip`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    let message = `✅ Succès ! ${result.filesSuccess}/${result.filesProcessed} fichiers ingérés`;

                    if (result.filesFailed > 0) {
                        message += `\n⚠️  ${result.filesFailed} fichiers ont échoué`;
                    }

                    if (result.errors && result.errors.length > 0) {
                        message += '\n\nErreurs:';
                        result.errors.forEach(err => {
                            message += `\n• ${err}`;
                        });
                    }

                    showStatus('success', message);

                    // Redirect to dashboard after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 3000);
                } else {
                    showStatus('error', `❌ Erreur: ${result.message || 'Échec du traitement'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('error', `❌ Erreur réseau: ${error.message}`);
            }
        }

        function showStatus(type, message) {
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = message.replace(/\n/g, '<br>');
        }
    </script>
</body>

</html>

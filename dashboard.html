<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons: Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            /* Light Theme (Default) */
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --primary: #3b82f6;
            --primary-dark: #60a5fa;
            --secondary: #94a3b8;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .layout {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--bg-card);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand img {
            height: 40px;
            width: auto;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
            padding-left: 1rem;
            border-left: 1px solid var(--border);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
        }

        .btn:hover {
            background: #f1f5f9;
        }

        [data-theme="dark"] .btn:hover {
            background: #334155;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        select {
            padding: 0.5rem 2.5rem 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-main);
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Stats Grid - Fixed Responsiveness */
        .stats-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
            /* Default to 4 columns for large screens */
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 1200px) {
            .stats-grid {
                /* 2 columns for medium screens (2-2 layout) */
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .stats-grid {
                /* 1 column for mobile (1-1-1-1 layout) */
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
            cursor: default;
        }

        /* Hover Effect: Scale Up */
        .stat-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .stat-icon {
            color: var(--text-muted);
            font-size: 1.25rem;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        /* Charts */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .card-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
            width: 100%;
        }

        /* Table */
        .table-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-input i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
        }

        .search-input input::placeholder {
            color: var(--text-muted);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 0.75rem 1.5rem;
            background: var(--bg-body);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .data-table th:hover {
            background: rgba(37, 99, 235, 0.05);
            color: var(--text-main);
        }

        .data-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .data-table tbody tr {
            transition: background 0.2s;
        }

        .data-table tbody tr:hover {
            background: rgba(37, 99, 235, 0.03);
            /* Dark mode specific hover fix */
        }

        [data-theme="dark"] .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .cell-zone {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .cell-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            border-radius: 6px;
            font-size: 1rem;
        }

        .cell-info {
            display: flex;
            flex-direction: column;
        }

        .cell-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .loading-state,
        .error-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .error-state {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-neutral {
            background: #f1f5f9;
            color: #475569;
        }

        .badge-primary {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .badge-success {
            background: #ecfdf5;
            color: #047857;
        }

        .badge-warning {
            background: #fffbeb;
            color: #b45309;
        }

        /* Dark mode badges */
        [data-theme="dark"] .badge-neutral {
            background: #334155;
            color: #cbd5e1;
        }

        [data-theme="dark"] .badge-primary {
            background: rgba(37, 99, 235, 0.2);
            color: #93c5fd;
        }

        [data-theme="dark"] .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        [data-theme="dark"] .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }
    </style>
</head>

<body>
    <div class="layout">
        <!-- Top Navigation -->
        <header class="header">
            <div class="brand">
                <img src="img/atalian-LOGO.png" alt="Atalian Global Services">
                <h1>Cleaning Analytics</h1>
            </div>
            <div class="controls">
                <!-- Theme Toggle -->
                <button class="btn" onclick="toggleTheme()" title="Mode Nuit">
                    <i id="themeIcon" class="ri-moon-line"></i>
                </button>
                <div style="width: 1px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>

                <button class="btn" onclick="navigateDate(-1)">
                    <i class="ri-arrow-left-s-line"></i>
                </button>
                <select id="dateSelector" onchange="loadSelectedDate()">
                    <option value="">Chargement...</option>
                </select>
                <button class="btn" onclick="navigateDate(1)">
                    <i class="ri-arrow-right-s-line"></i>
                </button>
                <div style="width: 1px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
                <button class="btn btn-primary" onclick="window.location.href='upload.html'">
                    <i class="ri-upload-cloud-line"></i>
                    <span>Importer</span>
                </button>
            </div>
        </header>

        <!-- KPI Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="loading-state">Chargement des données...</div>
        </div>

        <!-- Chart Section -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Évolution Temporelle</h2>
            </div>
            <div class="chart-wrapper">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Détail des Zones</h2>
            </div>
            <div class="table-controls">
                <div class="search-input">
                    <i class="ri-search-line"></i>
                    <input type="text" id="searchZone" placeholder="Rechercher une zone..."
                        oninput="applyFiltersAndSort()">
                </div>
                <div style="flex: 1;"></div>
                <select id="rowLimit" onchange="applyFiltersAndSort()" style="width: auto;">
                    <option value="10">10 lignes</option>
                    <option value="30" selected>30 lignes</option>
                    <option value="50">50 lignes</option>
                    <option value="all">Tout afficher</option>
                </select>
            </div>

            <div class="table-container" style="overflow-x: auto;">
                <div id="tableContent">
                    <div class="loading-state">Chargement du tableau...</div>
                </div>
                <div id="displayInfo"
                    style="padding: 1rem 1.5rem; color: var(--text-muted); font-size: 0.875rem; text-align: right;">
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2025 Atalian Global Services &bull; Dashboard Analytics</p>
        </footer>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        // Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
            updateChartTheme(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.className = 'ri-sun-line';
            } else {
                icon.className = 'ri-moon-line';
            }
        }

        function updateChartTheme(theme) {
            if (evolutionChart) {
                const isDark = theme === 'dark';
                Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';
                evolutionChart.options.scales.y.grid.color = isDark ? '#334155' : '#f1f5f9';
                evolutionChart.update();
            }
        }

        // Init Theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.addEventListener('DOMContentLoaded', () => updateThemeIcon(savedTheme));

        // Professional Icon Mapping (RemixIcon)
        const getZoneIcon = (index) => {
            const icons = [
                'ri-building-4-line',
                'ri-community-line',
                'ri-store-2-line',
                'ri-hotel-line',
                'ri-building-2-line',
                'ri-government-line'
            ];
            return icons[index % icons.length];
        };

        let availableDates = [];
        let currentDateIndex = 0;
        let evolutionChart = null;
        let allMetrics = [];
        let sortColumn = null;
        let sortDirection = 'asc';

        // Initialize
        async function loadAvailableDates() {
            try {
                const response = await fetch(`${API_URL}/metrics/dates/available`);
                const data = await response.json();
                availableDates = data.dates;

                const selector = document.getElementById('dateSelector');
                selector.innerHTML = availableDates.map((date, index) => {
                    const dateObj = new Date(date);
                    const formatted = dateObj.toLocaleDateString('fr-FR', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                    return `<option value="${index}">${formatted}</option>`;
                }).join('');

                currentDateIndex = 0;
                await loadDate(availableDates[0]);
                await loadEvolutionChart();

            } catch (error) {
                console.error('Error loading dates:', error);
                document.getElementById('statsGrid').innerHTML =
                    '<div class="error-state"><i class="ri-error-warning-line"></i> Connexion au serveur échouée</div>';
            }
        }

        async function loadDate(date) {
            try {
                const [statsRes, metricsRes] = await Promise.all([
                    fetch(`${API_URL}/metrics/stats/summary?date=${date}`),
                    fetch(`${API_URL}/metrics?date=${date}`)
                ]);

                const stats = await statsRes.json();
                const metricsData = await metricsRes.json();

                allMetrics = metricsData.data;
                renderStats(stats);
                applyFiltersAndSort();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('statsGrid').innerHTML =
                    '<div class="error-state">Erreur de chargement des données</div>';
            }
        }

        function renderStats(stats) {
            const kpiConfig = [
                { label: 'Total Zones', value: stats.totalZones, icon: 'ri-map-pin-line' },
                { label: 'Total Passagers', value: stats.totalPax.toLocaleString('fr-FR'), icon: 'ri-group-line' },
                { label: 'Heures Maintenance', value: stats.totalMaintenanceHours.toLocaleString('fr-FR') + 'h', icon: 'ri-tools-line' },
                { label: 'Heures Renfort', value: stats.totalAdditionnelleHours.toLocaleString('fr-FR') + 'h', icon: 'ri-time-line' }
            ];

            const statsHtml = kpiConfig.map(kpi => `
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">${kpi.label}</span>
                        <i class="${kpi.icon} stat-icon"></i>
                    </div>
                    <div class="stat-value">${kpi.value}</div>
                </div>
            `).join('');

            document.getElementById('statsGrid').innerHTML = statsHtml;
        }

        async function loadEvolutionChart() {
            try {
                const allStats = await Promise.all(
                    availableDates.map(date =>
                        fetch(`${API_URL}/metrics/stats/summary?date=${date}`)
                            .then(r => r.json())
                    )
                );

                // Reverse for chronological order (Oldest -> Newest on the chart)
                const chartStats = [...allStats].reverse();
                const chartDates = availableDates.map(d =>
                    new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
                ).reverse();

                const ctx = document.getElementById('evolutionChart').getContext('2d');

                // Professional Theme Colors
                Chart.defaults.font.family = "'Inter', sans-serif";
                Chart.defaults.color = '#64748b';

                if (evolutionChart) evolutionChart.destroy();

                evolutionChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartDates,
                        datasets: [
                            {
                                label: 'Passagers',
                                data: chartStats.map(s => s.totalPax),
                                borderColor: '#2563eb', // Primary Blue
                                backgroundColor: 'rgba(37, 99, 235, 0.05)',
                                tension: 0.3,
                                borderWidth: 2,
                                fill: true,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Maintenance (h)',
                                data: chartStats.map(s => s.totalMaintenanceHours),
                                borderColor: '#10b981', // Emerald
                                borderDash: [5, 5],
                                tension: 0.3,
                                borderWidth: 2,
                                pointRadius: 0,
                                yAxisID: 'y1'
                            },
                            {
                                label: 'Renfort (h)',
                                data: chartStats.map(s => s.totalAdditionnelleHours),
                                borderColor: '#f59e0b', // Amber
                                borderDash: [2, 2],
                                tension: 0.3,
                                borderWidth: 2,
                                pointRadius: 0,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                position: 'top',
                                align: 'end',
                                labels: { boxWidth: 10, usePointStyle: true }
                            },
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Passagers',
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { color: '#f1f5f9' },
                                ticks: { callback: v => v.toLocaleString('fr-FR') }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Heures',
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { display: false }
                            },
                            x: {
                                grid: { display: false }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error(error);
            }
        }

        // Table & Filtering Logic
        function loadSelectedDate() {
            const selector = document.getElementById('dateSelector');
            const val = selector.value;
            if (val === "") return;
            currentDateIndex = parseInt(val);
            loadDate(availableDates[currentDateIndex]);
        }

        function navigateDate(direction) {
            const newIndex = currentDateIndex + direction;
            if (newIndex >= 0 && newIndex < availableDates.length) {
                currentDateIndex = newIndex;
                document.getElementById('dateSelector').value = currentDateIndex;
                loadDate(availableDates[currentDateIndex]);
            }
        }

        function applyFiltersAndSort() {
            const searchTerm = document.getElementById('searchZone').value.toLowerCase();
            const rowLimit = document.getElementById('rowLimit').value;

            let filteredMetrics = allMetrics.filter(metric =>
                metric.zoneName.toLowerCase().includes(searchTerm) ||
                metric.zoneId.toLowerCase().includes(searchTerm)
            );

            if (sortColumn) {
                filteredMetrics.sort((a, b) => {
                    let aVal, bVal;
                    switch (sortColumn) {
                        case 'zone': aVal = a.zoneName.toLowerCase(); bVal = b.zoneName.toLowerCase(); break;
                        case 'maintenance': aVal = a.occurrencesMaintenance || 0; bVal = b.occurrencesMaintenance || 0; break;
                        case 'additionnelles': aVal = a.occurrencesAdditionnelles || 0; bVal = b.occurrencesAdditionnelles || 0; break;
                        case 'pax': aVal = a.paxTotal || 0; bVal = b.paxTotal || 0; break;
                        case 'duree':
                            const aT = (a.dureeMaintenanceSeconds || 0) + (a.dureeAdditionnelleSeconds || 0);
                            const aO = (a.occurrencesMaintenance || 0) + (a.occurrencesAdditionnelles || 0);
                            aVal = aO > 0 ? aT / aO : 0;
                            const bT = (b.dureeMaintenanceSeconds || 0) + (b.dureeAdditionnelleSeconds || 0);
                            const bO = (b.occurrencesMaintenance || 0) + (b.occurrencesAdditionnelles || 0);
                            bVal = bO > 0 ? bT / bO : 0;
                            break;
                    }
                    if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            const total = filteredMetrics.length;
            const displayMetrics = rowLimit === 'all' ? filteredMetrics : filteredMetrics.slice(0, parseInt(rowLimit));

            document.getElementById('displayInfo').textContent = `${displayMetrics.length} résultats / ${total}`;
            renderTable(displayMetrics);
        }

        function sortBy(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            applyFiltersAndSort();
        }

        function renderTable(metrics) {
            let tableHtml = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th onclick="sortBy('zone')">Zone <i class="ri-expand-up-down-fill" style="opacity:0.3; vertical-align: middle;"></i></th>
                            <th onclick="sortBy('maintenance')">Occurrences <i class="ri-expand-up-down-fill" style="opacity:0.3; vertical-align: middle;"></i></th>
                            <th onclick="sortBy('additionnelles')">Renforts <i class="ri-expand-up-down-fill" style="opacity:0.3; vertical-align: middle;"></i></th>
                            <th onclick="sortBy('pax')">Passagers <i class="ri-expand-up-down-fill" style="opacity:0.3; vertical-align: middle;"></i></th>
                            <th onclick="sortBy('duree')" style="text-align: right;">Durée Moy. <i class="ri-expand-up-down-fill" style="opacity:0.3; vertical-align: middle;"></i></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            metrics.forEach((metric, index) => {
                const totalSeconds = (metric.dureeMaintenanceSeconds || 0) + (metric.dureeAdditionnelleSeconds || 0);
                const totalOcc = (metric.occurrencesMaintenance || 0);
                const avgMin = totalOcc > 0 ? Math.round(totalSeconds / totalOcc / 60) : 0;

                tableHtml += `
                    <tr>
                        <td>
                            <div class="cell-zone">
                                <div class="cell-icon">
                                    <i class="${getZoneIcon(index)}"></i>
                                </div>
                                <div class="cell-info">
                                    <span style="font-weight: 500;">${metric.zoneName}</span>
                                    <span class="cell-sub">${metric.zoneId.split('/').pop()}</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-neutral">${metric.occurrencesMaintenance || 0}</span>
                        </td>
                        <td>
                            ${(metric.occurrencesAdditionnelles || 0) > 0
                        ? `<span class="badge badge-warning">${metric.occurrencesAdditionnelles}</span>`
                        : '<span style="color: var(--text-muted);">-</span>'}
                        </td>
                        <td style="font-weight: 600; font-family: monospace;">
                            ${(metric.paxTotal || 0).toLocaleString('fr-FR')}
                        </td>
                        <td style="text-align: right;">
                            <span class="badge badge-success">${avgMin} min</span>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('tableContent').innerHTML = tableHtml;
        }

        loadAvailableDates();
    </script>
</body>

</html>

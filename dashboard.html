<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date-selector {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-selector select {
            padding: 12px 20px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }

        .date-selector select:hover {
            border-color: #764ba2;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .date-selector button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .date-selector button:hover {
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 5px solid;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-card.blue {
            border-color: #3b82f6;
        }

        .stat-card.purple {
            border-color: #8b5cf6;
        }

        .stat-card.green {
            border-color: #10b981;
        }

        .stat-card.pink {
            border-color: #ec4899;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .chart-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .table-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .table-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-controls label {
            font-weight: 600;
            color: #667eea;
        }

        .table-controls select,
        .table-controls input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .table-controls select:hover,
        .table-controls input:hover {
            border-color: #764ba2;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .table-controls input {
            min-width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th:hover {
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
        }

        th.sortable::after {
            content: ' ↕';
            opacity: 0.3;
            font-size: 0.8em;
        }

        th.sort-asc::after {
            content: ' ▲';
            opacity: 1;
        }

        th.sort-desc::after {
            content: ' ▼';
            opacity: 1;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .zone-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.3em;
            margin-right: 10px;
        }

        .zone-name {
            font-weight: 600;
            color: #333;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .badge-blue {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-purple {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .badge-green {
            background: #d1fae5;
            color: #065f46;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: white;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .footer {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
            color: #666;
        }

        .icon-1 {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .icon-2 {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .icon-3 {
            background: linear-gradient(135deg, #ec4899, #db2777);
        }

        .icon-4 {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .icon-5 {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .icon-6 {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
        }

        .icon-7 {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        .icon-8 {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>📊 Cleaning Analytics Dashboard</h1>
                <div class="date" id="currentDate">Chargement...</div>
            </div>
            <div class="date-selector">
                <button onclick="navigateDate(-1)">◀ Précédent</button>
                <select id="dateSelector" onchange="loadSelectedDate()">
                    <option value="">Chargement...</option>
                </select>
                <button onclick="navigateDate(1)">Suivant ▶</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">Chargement des statistiques...</div>
        </div>

        <div class="chart-container">
            <h2>📈 Évolution Temporelle des KPI</h2>
            <div class="chart-wrapper">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h2 style="margin-bottom: 20px; color: #333;">📋 Liste des Zones</h2>
            <div class="table-controls">
                <div>
                    <label for="rowLimit">Afficher :</label>
                    <select id="rowLimit" onchange="applyFiltersAndSort()">
                        <option value="10">10 zones</option>
                        <option value="30" selected>30 zones</option>
                        <option value="50">50 zones</option>
                        <option value="100">100 zones</option>
                        <option value="all">Toutes</option>
                    </select>
                </div>
                <div>
                    <label for="searchZone">Rechercher :</label>
                    <input type="text" id="searchZone" placeholder="Filtrer par nom de zone..."
                        oninput="applyFiltersAndSort()">
                </div>
                <div id="displayInfo" style="color: #666; margin-left: auto;"></div>
            </div>
            <div id="tableContent">
                <div class="loading">Chargement des données...</div>
            </div>
        </div>

        <div class="footer">
            © 2025 Cleaning Analytics • Powered by Node.js & Vanilla JavaScript
            <br>
            <a href="upload.html"
                style="color: #667eea; text-decoration: none; margin-top: 10px; display: inline-block; font-weight: 600;">📦
                Upload ZIP</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const zoneEmojis = ['🏢', '👥', '🚻', '🚪', '🏃', '🚺', '🚹', '🔧'];

        let availableDates = [];
        let currentDateIndex = 0;
        let evolutionChart = null;
        let allMetrics = [];
        let sortColumn = null;
        let sortDirection = 'asc';

        async function loadAvailableDates() {
            try {
                const response = await fetch(`${API_URL}/metrics/dates/available`);
                const data = await response.json();
                availableDates = data.dates;

                const selector = document.getElementById('dateSelector');
                selector.innerHTML = availableDates.map((date, index) => {
                    const dateObj = new Date(date);
                    const formatted = dateObj.toLocaleDateString('fr-FR', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                    return `<option value="${index}">${formatted}</option>`;
                }).join('');

                currentDateIndex = 0;
                await loadDate(availableDates[0]);
                await loadEvolutionChart();

            } catch (error) {
                console.error('Error loading dates:', error);
                document.getElementById('statsGrid').innerHTML =
                    '<div class="error">❌ Erreur de chargement. Vérifiez que l\'API tourne sur http://localhost:3000</div>';
            }
        }

        async function loadDate(date) {
            try {
                document.getElementById('currentDate').textContent =
                    `📅 ${new Date(date).toLocaleDateString('fr-FR', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    })}`;

                const [statsRes, metricsRes] = await Promise.all([
                    fetch(`${API_URL}/metrics/stats/summary?date=${date}`),
                    fetch(`${API_URL}/metrics?date=${date}`)
                ]);

                const stats = await statsRes.json();
                const metricsData = await metricsRes.json();

                allMetrics = metricsData.data;
                renderStats(stats);
                applyFiltersAndSort();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('statsGrid').innerHTML =
                    '<div class="error">❌ Erreur de chargement des données</div>';
            }
        }

        async function loadEvolutionChart() {
            try {
                const allStats = await Promise.all(
                    availableDates.map(date =>
                        fetch(`${API_URL}/metrics/stats/summary?date=${date}`)
                            .then(r => r.json())
                    )
                );

                const dates = availableDates.map(d =>
                    new Date(d).toLocaleDateString('fr-FR', {
                        day: 'numeric',
                        month: 'short'
                    })
                );

                const ctx = document.getElementById('evolutionChart').getContext('2d');

                if (evolutionChart) {
                    evolutionChart.destroy();
                }

                evolutionChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Total Passagers',
                                data: allStats.map(s => s.totalPax),
                                borderColor: '#8b5cf6',
                                backgroundColor: 'rgba(139, 92, 246, 0.1)',
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Heures Maintenance',
                                data: allStats.map(s => s.totalMaintenanceHours),
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.4,
                                yAxisID: 'y1'
                            },
                            {
                                label: 'Heures Renfort',
                                data: allStats.map(s => s.totalAdditionnelleHours),
                                borderColor: '#ec4899',
                                backgroundColor: 'rgba(236, 72, 153, 0.1)',
                                tension: 0.4,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    font: { size: 14, weight: 'bold' },
                                    padding: 20
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                padding: 12,
                                titleFont: { size: 14, weight: 'bold' },
                                bodyFont: { size: 13 }
                            }
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Passagers',
                                    font: { size: 14, weight: 'bold' }
                                },
                                ticks: {
                                    callback: function (value) {
                                        return value.toLocaleString('fr-FR');
                                    }
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Heures',
                                    font: { size: 14, weight: 'bold' }
                                },
                                grid: {
                                    drawOnChartArea: false
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading evolution chart:', error);
            }
        }

        function loadSelectedDate() {
            const selector = document.getElementById('dateSelector');
            currentDateIndex = parseInt(selector.value);
            loadDate(availableDates[currentDateIndex]);
        }

        function navigateDate(direction) {
            const newIndex = currentDateIndex + direction;
            if (newIndex >= 0 && newIndex < availableDates.length) {
                currentDateIndex = newIndex;
                document.getElementById('dateSelector').value = currentDateIndex;
                loadDate(availableDates[currentDateIndex]);
            }
        }

        function renderStats(stats) {
            const statsHtml = `
                <div class="stat-card blue">
                    <div class="stat-label">Total Zones</div>
                    <div class="stat-value">${stats.totalZones}</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-label">Total Passagers</div>
                    <div class="stat-value">${stats.totalPax.toLocaleString('fr-FR')}</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">Heures Maintenance</div>
                    <div class="stat-value">${stats.totalMaintenanceHours.toLocaleString('fr-FR')}h</div>
                </div>
                <div class="stat-card pink">
                    <div class="stat-label">Heures Renfort</div>
                    <div class="stat-value">${stats.totalAdditionnelleHours.toLocaleString('fr-FR')}h</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHtml;
        }

        function applyFiltersAndSort() {
            const searchTerm = document.getElementById('searchZone').value.toLowerCase();
            const rowLimit = document.getElementById('rowLimit').value;

            // Filter metrics
            let filteredMetrics = allMetrics.filter(metric =>
                metric.zoneName.toLowerCase().includes(searchTerm)
            );

            // Sort metrics
            if (sortColumn) {
                filteredMetrics.sort((a, b) => {
                    let aVal, bVal;

                    switch (sortColumn) {
                        case 'date':
                            aVal = new Date(a.date);
                            bVal = new Date(b.date);
                            break;
                        case 'zone':
                            aVal = a.zoneName.toLowerCase();
                            bVal = b.zoneName.toLowerCase();
                            break;
                        case 'maintenance':
                            aVal = a.occurrencesMaintenance || 0;
                            bVal = b.occurrencesMaintenance || 0;
                            break;
                        case 'additionnelles':
                            aVal = a.occurrencesAdditionnelles || 0;
                            bVal = b.occurrencesAdditionnelles || 0;
                            break;
                        case 'pax':
                            aVal = a.paxTotal || 0;
                            bVal = b.paxTotal || 0;
                            break;
                        case 'duree':
                            aVal = (a.dureeMaintenanceSeconds || 0) + (a.dureeAdditionnelleSeconds || 0);
                            bVal = (b.dureeMaintenanceSeconds || 0) + (b.dureeAdditionnelleSeconds || 0);
                            break;
                        default:
                            return 0;
                    }

                    if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            // Apply row limit
            const total = filteredMetrics.length;
            const displayMetrics = rowLimit === 'all' ? filteredMetrics : filteredMetrics.slice(0, parseInt(rowLimit));

            // Update display info
            document.getElementById('displayInfo').textContent =
                `Affichage de ${displayMetrics.length} sur ${total} zones`;

            renderTable(displayMetrics);
        }

        function sortBy(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            applyFiltersAndSort();
        }

        function renderTable(metrics) {
            let tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th class="sortable ${sortColumn === 'date' ? 'sort-' + sortDirection : ''}" onclick="sortBy('date')">Date</th>
                            <th class="sortable ${sortColumn === 'zone' ? 'sort-' + sortDirection : ''}" onclick="sortBy('zone')">Zone</th>
                            <th class="sortable ${sortColumn === 'maintenance' ? 'sort-' + sortDirection : ''}" onclick="sortBy('maintenance')" style="text-align: center;">Occurr.</th>
                            <th class="sortable ${sortColumn === 'additionnelles' ? 'sort-' + sortDirection : ''}" onclick="sortBy('additionnelles')" style="text-align: center;">Additionnelles</th>
                            <th class="sortable ${sortColumn === 'pax' ? 'sort-' + sortDirection : ''}" onclick="sortBy('pax')" style="text-align: center;">Passagers</th>
                            <th class="sortable ${sortColumn === 'duree' ? 'sort-' + sortDirection : ''}" onclick="sortBy('duree')" style="text-align: right;">Durée (min)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            metrics.forEach((metric, index) => {
                const emoji = zoneEmojis[index % zoneEmojis.length];
                const iconClass = `icon-${(index % 8) + 1}`;
                const date = new Date(metric.date);
                const dateStr = `${date.getDate()} ${date.toLocaleDateString('fr-FR', { month: 'short' })} ${date.getFullYear().toString().substr(2)}`;

                const maintenanceMin = Math.round((metric.dureeMaintenanceSeconds || 0) / 60);
                const renforcementMin = Math.round((metric.dureeAdditionnelleSeconds || 0) / 60);
                const totalMin = maintenanceMin + renforcementMin;

                tableHtml += `
                    <tr>
                        <td>${dateStr}</td>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <div class="zone-icon ${iconClass}">${emoji}</div>
                                <div>
                                    <div class="zone-name">${metric.zoneName}</div>
                                    <div style="font-size: 0.8em; color: #999;">
                                        ${metric.zoneId.split('/').pop()}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td style="text-align: center;">
                            <span class="badge badge-blue">${metric.occurrencesMaintenance || 0}</span>
                        </td>
                        <td style="text-align: center;">
                            <span class="badge badge-purple">${metric.occurrencesAdditionnelles || 0}</span>
                        </td>
                        <td style="text-align: center; font-weight: bold; color: #06b6d4; font-size: 1.1em;">
                            ${(metric.paxTotal || 0).toLocaleString('fr-FR')}
                        </td>
                        <td style="text-align: right;">
                            <span class="badge badge-green">${totalMin} min</span>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `
                    </tbody>
                </table>
            `;

            document.getElementById('tableContent').innerHTML = tableHtml;
        }

        loadAvailableDates();
    </script>
</body>

</html>
